<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>

<body>

<!-- (UNCHANGED HTML STRUCTURE — all good) -->

<script>
'use strict';

/* ========= CONFIG ========= */
const SK = 'lp90_v7';
const PK = 'lp90_profile';
const SESS = 'lp90_sess';
const TTL = 30 * 60 * 1000;

/* ========= DATE HELPERS ========= */
function lds(d){
  const dt = d || new Date();
  return dt.getFullYear() + '-' +
    String(dt.getMonth()+1).padStart(2,'0') + '-' +
    String(dt.getDate()).padStart(2,'0');
}

const tKey = () => lds();

const yKey = () => {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return lds(d);
};

function friendly(k){
  if(k === tKey()) return 'Today';
  if(k === yKey()) return 'Yesterday';
  return new Date(k + 'T12:00:00')
    .toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

/* ========= STORAGE ========= */
function safeSet(key,val){
  try{
    localStorage.setItem(key, JSON.stringify(val));
  } catch(e){
    console.warn('Storage failed', e);
  }
}

function safeGet(key, fallback){
  try{
    const r = localStorage.getItem(key);
    return r ? JSON.parse(r) : fallback;
  } catch(e){
    console.warn('Storage read failed', e);
    return fallback;
  }
}

/* ========= STATE ========= */
const APP = {
  state: safeGet(SK, {entries:{}, startDate: lds()}),
  profile: safeGet(PK, {name:'Eli', duration:90, budget:10}),
  draft: {},
  activeDate: tKey(),
  view: 'log'
};

/* ========= SCORING ========= */
function sMetric(m,v){
  if(v === undefined || v === null || v === '') return null;

  if(m.type === 'bool') return v ? 100 : 0;

  if(m.id === 'sleep'){
    return Math.min(100, Math.max(0, ((v - 4.5)/3)*100));
  }

  if(m.id === 'drinks'){
    return Math.max(0, 100 - v * 16.67);
  }

  return null;
}

function sEntry(entry){
  if(!entry) return null;

  let total = 0, max = 0, any = false;

  for(const m of M){
    const r = sMetric(m, entry[m.id]);
    max += m.weight * 100;

    if(r !== null){
      total += r * m.weight;
      any = true;
    }
  }

  return any ? Math.round((total/max)*100) : null;
}

/* ========= SAFE DISPLAY ========= */
function display(val){
  return (val === null || val === undefined) ? '—' : val;
}

/* ========= RENDER ========= */
function render(){
  try{
    if(APP.view === 'log') renderLog();
    if(APP.view === 'portfolio') renderPortfolio();
  } catch(e){
    console.error('Render error:', e);
  }
}

/* ========= LOG VIEW ========= */
function renderLog(){
  const el = document.getElementById('view-log');
  const entry = APP.state.entries[APP.activeDate] || {};
  const score = sEntry(entry);

  el.innerHTML = `
    <div style="padding:20px">
      <h2>${friendly(APP.activeDate)}</h2>
      <div>Score: <strong>${display(score)}</strong></div>
    </div>
  `;
}

/* ========= PORTFOLIO ========= */
function renderPortfolio(){
  const el = document.getElementById('view-portfolio');

  const scores = Object.values(APP.state.entries)
    .map(e => sEntry(e))
    .filter(s => s !== null);

  const avg = scores.length
    ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length)
    : null;

  el.innerHTML = `
    <div style="padding:20px">
      <h2>Portfolio</h2>
      <div>7-Day Avg: <strong>${display(avg)}</strong></div>
    </div>
  `;
}

/* ========= INIT ========= */
document.addEventListener('DOMContentLoaded', () => {
  render();
});
</script>

</body>
</html>
